name: release

# Auto-publish a release on push to main: reads AIBOX_VERSION from bin/aibox.
# If the remote has no matching v<version> tag, it creates the tag + release (notes auto-generated
# from the previous tag). If the version is unchanged it skips (idempotent, safe to re-push).
# A SHA256SUMS sidecar is attached so `AIBOX_VERIFY=1` can verify the bootstrap.
# See AGENTS.md "Versioning & release flow".

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: extract AIBOX_VERSION
        id: v
        run: |
          ver=$(grep -oE '^AIBOX_VERSION="[^"]+"' bin/aibox | head -1 | sed -E 's/^AIBOX_VERSION="([^"]+)"/\1/')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"

      - name: check if tag exists
        id: t
        env:
          RELEASE_TAG: ${{ steps.v.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tag ${RELEASE_TAG} already exists, skipping release"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::creating release for ${RELEASE_TAG}"
          fi

      - name: create SHA256SUMS sidecar
        if: steps.t.outputs.exists != 'true'
        run: |
          sha256sum bin/aibox install.sh > SHA256SUMS
          cat SHA256SUMS

      # Open-source bar for release notes: the CURATED changelog section for this
      # version leads the body (what + why, per AGENTS.md changelog standard);
      # --generate-notes appends the commit list after it.
      - name: extract curated changelog section
        if: steps.t.outputs.exists != 'true'
        env:
          RELEASE_TAG: ${{ steps.v.outputs.tag }}
        run: |
          ver="${RELEASE_TAG#v}"
          awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]" {insec=1; next}
            insec && /^## \[/ {exit}
            insec {print}
          ' CHANGELOG.md > /tmp/cl-section.md
          {
            echo "## What's changed"
            if [ -s /tmp/cl-section.md ]; then cat /tmp/cl-section.md; else echo "(see CHANGELOG.md)"; fi
          } > NOTES.md
          echo '--- NOTES.md ---'; cat NOTES.md

      - name: create release
        if: steps.t.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh release create "${RELEASE_TAG}" \
            --target main \
            --title "aibox ${RELEASE_TAG}" \
            --notes-file NOTES.md \
            --generate-notes \
            SHA256SUMS
