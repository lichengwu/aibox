name: lint

# Quality gate: bash syntax + shellcheck + gotcha scans + module.yaml rules + port conflicts + tests.
# - bash -n / shellcheck / gotchas: script quality (see AGENTS.md pitfalls #1 #2 #6 #8)
# - module-lint: module.yaml required fields + §2.2 subset (yq authoritative, keeps the awk parser safe)
# - port-conflict: cross-module port conflicts (static declaration + CI gate, spec §3)
# - tests: bats behavioral tests (proxy/installed/registry)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-check:
    name: bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax check
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if ! bash -n "$f"; then
              echo "::error file=${f}::bash -n syntax error"
              fail=1
            fi
          done < <(git ls-files | grep -E '\.sh$|^(bin/aibox|tools/[^/]+/cli/(openmaic|windmill))$')
          exit $fail

  shellcheck:
    name: shellcheck (error)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: |
          set -e
          mapfile -t files < <(git ls-files | grep -E '\.sh$|^(bin/aibox|tools/[^/]+/cli/(openmaic|windmill))$')
          # --shell=bash: lib.sh is a sourced library (no shebang); specify the shell explicitly to avoid SC2148.
          shellcheck --severity=error --external-sources --shell=bash "${files[@]}"

  bash32-gotchas:
    name: bash 3.2 gotchas (#1 #8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scan AGENTS.md pitfalls #1 #8
        run: |
          set -e
          fail=0
          mapfile -t files < <(git ls-files | grep -E '\.sh$|^(bin/aibox|tools/[^/]+/cli/(openmaic|windmill))$')
          for f in "${files[@]}"; do
            m1="$(grep -nP '\$[A-Za-z_][A-Za-z0-9_]*[，。、；：！？（）「」]' "$f" | grep -vE '^[0-9]+:[[:space:]]*#' || true)"
            if [ -n "$m1" ]; then
              echo "::error file=${f}::gotcha #1: full-width punctuation right after a bare \$VAR; use \${VAR}"
              echo "$m1"; fail=1
            fi
            m8="$(grep -nP 'local\s+([A-Za-z_]\w*)\s*=\s*"[^"]*"\s+[A-Za-z_]\w*\s*=\s*"\$\{?\1' "$f" | grep -vE '^[0-9]+:[[:space:]]*#' || true)"
            if [ -n "$m8" ]; then
              echo "::error file=${f}::gotcha #8: local references a prior var on the same line; split into two lines"
              echo "$m8"; fail=1
            fi
          done
          exit $fail

  module-lint:
    name: module.yaml lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install yq
        run: |
          sudo wget -qO/usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: validate module.yaml (required + §2.2 subset + ports + files + lifecycle + dashboard + full names)
        run: |
          set -e
          fail=0
          for f in tools/*/module.yaml; do
            [ -f "$f" ] || continue
            name="$(yq '.name' "$f")"
            # required fields
            for key in name version description dir; do
              yq -e ".$key" "$f" >/dev/null 2>&1 || { echo "::error file=$f::missing required field $key"; fail=1; }
            done
            yq -e '.hooks.install' "$f" >/dev/null 2>&1 || { echo "::error file=$f::missing hooks.install"; fail=1; }
            # §2.2 subset compliance: anchors/refs (&name/*name), block scalars (key:|/>), flow (key:{/[]/-{/-[);
            # note: ${...} / <...> inside quoted strings are scalar values, not flagged.
            if grep -nE '[&*][A-Za-z_]|:[[:space:]]*[|>]|:[[:space:]]*[[{]|^[[:space:]]*-[[:space:]]*[[{]' "$f" | grep -vE '^[0-9]+:[[:space:]]*#'; then
              echo "::error file=$f::contains §2.2-forbidden YAML syntax (anchors/block scalars/flow); awk parser unsupported"; fail=1
            fi
            # ports format: port/proto:usage
            for p in $(yq -o=ts '.ports[]' "$f" 2>/dev/null || true); do
              echo "$p" | grep -qE '^[0-9]+/(tcp|udp):' || { echo "::error file=$f::ports format wrong (expected port/proto:usage): $p"; fail=1; }
            done
            # files: listed extra files must exist under tools/<name>/
            for ff in $(yq -o=ts '.files[]' "$f" 2>/dev/null || true); do
              [ -f "tools/$name/$ff" ] || { echo "::error file=$f::files lists but not in repo: $ff"; fail=1; }
            done
            # lifecycle: a module with start must have the full lifecycle set (start/stop/restart/status/logs)
            if yq -o=ts '.actions[]' "$f" 2>/dev/null | grep -qx start; then
              for a in start stop restart status logs; do
                yq -o=ts '.actions[]' "$f" 2>/dev/null | grep -qx "$a" || { echo "::error file=$f::service-type module (has start) missing lifecycle action: $a"; fail=1; }
              done
            fi
            # dashboard: only endpoints + hint subfields allowed
            while IFS= read -r k; do
              [ -z "$k" ] && continue
              case "$k" in endpoints|hint) ;; *) echo "::error file=$f::dashboard allows only endpoints/hint; got: $k"; fail=1;; esac
            done < <(yq '.dashboard' "$f" 2>/dev/null | grep -E '^[a-z_-]+:' | sed -E 's/^([a-z_-]+):.*/\1/')
            # services/provides: component name must be a full-name whitelist entry
            for c in $(yq -o=ts '.services[]' "$f" 2>/dev/null | sed -E 's/^[^:]*://; s/#.*//' || true) \
                     $(yq -o=ts '.provides[]' "$f" 2>/dev/null || true); do
              case "$c" in postgres|redis) ;; *) echo "::error file=$f::component must be a full-name whitelist entry (postgres|redis); got: $c"; fail=1;; esac
            done
            echo "  ok: $f"
          done
          exit $fail

  deps-lint:
    name: deps-lint (services/provides + no hardcoded creds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install yq
        run: |
          sudo wget -qO/usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: services/provides validation + no hardcoded creds
        run: |
          set -e
          fail=0
          # 1. No hardcoded credentials: tools/*/docker-compose*.yml (except base) must not contain aibox:aibox@ / postgres://aibox:
          while IFS= read -r line; do
            echo "::error file=${line%%:*}::compose must not hardcode credentials (use \${AIBOX_POSTGRES_*} via base.env): ${line}"
            fail=1
          done < <(grep -rnE 'aibox:aibox@|postgres://aibox:' tools/*/docker-compose*.yml 2>/dev/null | grep -v 'tools/base/' || true)
          # 2. services provider/component must match some provider's provides; dbname must be <module> or <module>_<usage>
          declare -A provides
          for f in tools/*/module.yaml; do
            [ -f "$f" ] || continue
            m=$(yq '.name' "$f")
            for c in $(yq -o=ts '.provides[]' "$f" 2>/dev/null || true); do
              provides["${m}:${c}"]=1
            done
          done
          for f in tools/*/module.yaml; do
            [ -f "$f" ] || continue
            m=$(yq '.name' "$f")
            for svc in $(yq -o=ts '.services[]' "$f" 2>/dev/null || true); do
              provider="${svc%%:*}"
              rest="${svc#*:}"
              component="${rest%%#*}"
              case "$svc" in *'#'*) db="${rest#*#}";; *) db="";; esac
              [ -n "${provides["${provider}:${component}"]:-}" ] || { echo "::error file=$f::services ${svc} doesn't match provider ${provider}'s provides ${component}"; fail=1; }
              if [ -n "$db" ]; then
                case "$db" in
                  "$m"|"$m"_*) ;;
                  *) echo "::error file=$f::services dbname must be ${m} or ${m}_<usage>; got: $db"; fail=1;;
                esac
              fi
            done
          done
          [ $fail -eq 0 ] && echo "✅ deps-lint passed"
          exit $fail

  shared-override-sync:
    name: shared override sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: openmaic docker-compose.shared.yml == CLI heredoc (no drift)
        run: |
          set -e
          # The repo keeps tools/openmaic/docker-compose.shared.yml as a REFERENCE copy;
          # the source of truth is the quoted heredoc in the CLI's _shared_override_write.
          # Extract the heredoc body, strip comments/blank lines (the reference copy carries
          # an extra explanatory header), and diff the functional content.
          awk '/<<.OVERRIDE.$/{f=1;next} f&&/^OVERRIDE$/{f=0} f' tools/openmaic/cli/openmaic \
            | grep -vE '^\s*#|^\s*$' > /tmp/generated.yml
          grep -vE '^\s*#|^\s*$' tools/openmaic/docker-compose.shared.yml > /tmp/reference.yml
          if ! diff -u /tmp/generated.yml /tmp/reference.yml; then
            echo "::error file=tools/openmaic/docker-compose.shared.yml::reference copy drifted from the CLI _shared_override_write heredoc — sync them"
            exit 1
          fi
          echo "✅ docker-compose.shared.yml matches the CLI heredoc"

  port-conflict:
    name: port conflict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install yq
        run: |
          sudo wget -qO/usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: detect cross-module port conflicts (port+proto must be unique)
        run: |
          set -e
          declare -A owner
          dup=0
          for f in tools/*/module.yaml; do
            [ -f "$f" ] || continue
            m=$(yq '.name' "$f")
            for p in $(yq -o=ts '.ports[]' "$f" 2>/dev/null || true); do
              pp="${p%%/*}"   # port
              proto=$(echo "$p" | sed -E 's#^[0-9]+/([a-z]+):.*#\1#')
              key="${pp}/${proto}"
              if [ -n "${owner[$key]:-}" ]; then
                echo "::error::port $key conflict: ${owner[$key]} and $m both declare it"
                dup=1
              else
                owner[$key]="$m"
              fi
            done
          done
          [ $dup -eq 0 ] && echo "✅ no port conflicts"
          exit $dup

  tests:
    name: bats tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install bats
        run: npm install -g bats
      - name: run tests
        run: bats tests/*.bats
