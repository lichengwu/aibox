name: lint

# Quality gate: bash syntax + shellcheck + gotcha scans + module.yaml rules + port conflicts + tests.
# - bash -n / shellcheck / gotchas: script quality (see AGENTS.md pitfalls #1 #2 #6 #8)
# - module-lint: module.yaml required fields + §2.2 subset (yq authoritative, keeps the awk parser safe)
# - port-conflict: cross-module port conflicts (static declaration + CI gate, spec §3)
# - tests: bats behavioral tests (proxy/installed/registry)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-check:
    name: bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax check
        run: |
          set -e
          fail=0
          while IFS= read -r f; do
            if ! bash -n "$f"; then
              echo "::error file=${f}::bash -n syntax error"
              fail=1
            fi
          done < <(git ls-files | grep -E '\.sh$|^(bin/aibox|tools/[^/]+/cli/(openmaic|windmill))$')
          exit $fail

  shellcheck:
    name: shellcheck (error)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: shellcheck
        run: |
          set -e
          mapfile -t files < <(git ls-files | grep -E '\.sh$|^(bin/aibox|tools/[^/]+/cli/(openmaic|windmill))$')
          # --shell=bash: lib.sh is a sourced library (no shebang); specify the shell explicitly to avoid SC2148.
          shellcheck --severity=error --external-sources --shell=bash "${files[@]}"

  bash32-gotchas:
    name: bash 3.2 gotchas (#1 #8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scan AGENTS.md pitfalls #1 #8
        run: |
          set -e
          fail=0
          mapfile -t files < <(git ls-files | grep -E '\.sh$|^(bin/aibox|tools/[^/]+/cli/(openmaic|windmill))$')
          for f in "${files[@]}"; do
            m1="$(grep -nP '\$[A-Za-z_][A-Za-z0-9_]*[，。、；：！？（）「」]' "$f" | grep -vE '^[0-9]+:[[:space:]]*#' || true)"
            if [ -n "$m1" ]; then
              echo "::error file=${f}::gotcha #1: full-width punctuation right after a bare \$VAR; use \${VAR}"
              echo "$m1"; fail=1
            fi
            m8="$(grep -nP 'local\s+([A-Za-z_]\w*)\s*=\s*"[^"]*"\s+[A-Za-z_]\w*\s*=\s*"\$\{?\1' "$f" | grep -vE '^[0-9]+:[[:space:]]*#' || true)"
            if [ -n "$m8" ]; then
              echo "::error file=${f}::gotcha #8: local references a prior var on the same line; split into two lines"
              echo "$m8"; fail=1
            fi
          done
          exit $fail

  module-lint:
    name: module conformance (validate-module.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install yq + shellcheck (the validator auto-uses both when present)
        run: |
          sudo wget -qO/usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          sudo apt-get update && sudo apt-get install -y shellcheck
      # Single rule source: scripts/validate-module.sh implements every module rule
      # (required fields, §2.2 awk-subset, ports format+conflicts, files, deps,
      # services/provides cross-refs, mandatory checks:, lifecycle, dashboard,
      # upstream, README/docs, hook script quality incl. gotchas #1/#8, and the
      # no-hardcoded-credentials compose scan). Local runs use the same script.
      - name: validate all modules
        run: scripts/validate-module.sh --all

  shared-override-sync:
    name: shared override sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: openmaic docker-compose.shared.yml == CLI heredoc (no drift)
        run: |
          set -e
          # The repo keeps tools/openmaic/docker-compose.shared.yml as a REFERENCE copy;
          # the source of truth is the quoted heredoc in the CLI's _shared_override_write.
          # Extract the heredoc body, strip comments/blank lines (the reference copy carries
          # an extra explanatory header), and diff the functional content.
          awk '/<<.OVERRIDE.$/{f=1;next} f&&/^OVERRIDE$/{f=0} f' tools/openmaic/cli/openmaic \
            | grep -vE '^\s*#|^\s*$' > /tmp/generated.yml
          grep -vE '^\s*#|^\s*$' tools/openmaic/docker-compose.shared.yml > /tmp/reference.yml
          if ! diff -u /tmp/generated.yml /tmp/reference.yml; then
            echo "::error file=tools/openmaic/docker-compose.shared.yml::reference copy drifted from the CLI _shared_override_write heredoc — sync them"
            exit 1
          fi
          echo "✅ docker-compose.shared.yml matches the CLI heredoc"

  port-conflict:
    name: port conflict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install yq
        run: |
          sudo wget -qO/usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: detect cross-module port conflicts (port+proto must be unique)
        run: |
          set -e
          declare -A owner
          dup=0
          for f in tools/*/module.yaml; do
            [ -f "$f" ] || continue
            m=$(yq '.name' "$f")
            for p in $(yq -o=ts '.ports[]' "$f" 2>/dev/null || true); do
              pp="${p%%/*}"   # port
              proto=$(echo "$p" | sed -E 's#^[0-9]+/([a-z]+):.*#\1#')
              key="${pp}/${proto}"
              if [ -n "${owner[$key]:-}" ]; then
                echo "::error::port $key conflict: ${owner[$key]} and $m both declare it"
                dup=1
              else
                owner[$key]="$m"
              fi
            done
          done
          [ $dup -eq 0 ] && echo "✅ no port conflicts"
          exit $dup

  tests:
    name: bats tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install bats
        run: npm install -g bats
      - name: run tests
        run: bats tests/*.bats
