name: integration

# Manual-dispatch integration: docker-heavy E2E suites distilled from live-machine
# testing (see tests/README.md). The flag-gated pi-web/windmill suites are NOT run
# here (real service-manager side effects / ~6GB image pulls) — run those on a
# throwaway host with AIBOX_IT_PIWEB=1 / AIBOX_IT_WINDMILL=1.

on: workflow_dispatch

permissions:
  contents: read

jobs:
  base-profiles:
    name: base multi-profile E2E (docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install bats
        run: npm install -g bats
      - name: run base-profiles integration
        run: bats tests/integration/base-profiles.bats
