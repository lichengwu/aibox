name: xiaozhi
version: 1.7.3
module_iface: 1
description: "Xiaozhi ESP32 server (docker compose): backend for xiaozhi-esp32 AI voice devices (manager console + websocket relay + bundled MySQL)"
platform: ""
dir: tools/xiaozhi

# Runtime deps (cmd / cmd@platform / cmd:majorVersion) — checked strictly by the
# install/update preflight; missing deps abort unless --skip-checks.
deps:
  - docker
  - docker-compose

# Host ports are in the aibox reserved band (spec §Port allocation): 31130 ws /
# 31131 console / 31132 vision+OTA http — upstream's 8000/8002/8003 are common
# three are free in this repo's port registry (overridable via XIAOZHI_*_PORT
# defaults and collide with other services. All are overridable in the deploy .env;
# container-internal ports stay 8000/8002/8003.
ports:
  - 31130/tcp:ws
  - 31131/tcp:http
  - 31132/tcp:http

# The curated 3-service compose (server + web + bundled MySQL). Redis comes
# from the shared aibox base via the external aiboxbasenet network + base.env.
files:
  - docker-compose.yml
state_files:
  - .env

# Shared-base Redis consumer: aibox ensure_services auto-starts base before
# install.sh runs (see module-spec §services). MySQL is BUNDLED — the base
# deliberately ships no MySQL, and xiaozhi's manager-api is MySQL-only
# (Spring druid + jdbc:mysql DSN; upstream has no PG support).
services:
  - base:redis#xiaozhi

# Shared library include (repo tools/_shared/<name>.sh → cached as
# _<name>.sh; lib.sh sources it). common = output helpers + docker.io pool.
includes:
  - common

hooks:
  install: install.sh
  uninstall: uninstall.sh
  update: update.sh
  svc: svc.sh

# Service-type: actions contains start → the full lifecycle set is mandatory
# (validator enforces stop/restart/status/logs). `credentials` surfaces the
# first-registered-admin flow; `secret` writes the manager-api server.secret
# into data/.config.yaml (the upstream console-managed-config handoff).
actions:
  - start
  - stop
  - restart
  - status
  - doctor
  - logs
  - credentials
  - secret
  - config

env:
  XIAOZHI_WS_PORT: "31130 — host websocket port (container 8000)"
  XIAOZHI_CONSOLE_PORT: "31131 — host console port (container 8002)"
  XIAOZHI_HTTP_PORT: "31132 — host http API port (container 8003)"
  XIAOZHI_SERVER_IMAGE: "ghcr …:server_0.9.6 — server image (aibox upgrade floats it)"
  XIAOZHI_WEB_IMAGE: "ghcr …:web_0.9.6 — console image"
  XIAOZHI_MYSQL_IMAGE: "mysql:8.0 — bundled MySQL image"
  XIAOZHI_MYSQL_PASSWORD: "generated — bundled MySQL root password [secret]"
  XIAOZHI_START_TIMEOUT: "300 — staged-start health-wait seconds"
  XIAOZHI_LOG_TAIL: "200 — log tail lines"

residue:
  containers: "^aibox-xiaozhi-(server|web|mysql)$"
  volumes: "^aibox_xiaozhi_(models|uploadfile|mysql)$"
usage:
  start: "Staged start: MySQL + console → secret → ws server (health-wait)"
  stop: "Stop containers"
  restart: "Recreate containers (applies .env changes)"
  status: "Container + console + ws + secret state + rich view"
  doctor: "Deep diagnostics: deps, docker, state, declared ports"
  logs: "Container logs"
  credentials: "Admin login + secret location"
  secret: "<value> — manually set the server.secret (console 参数管理)"
  config: "Show/set config keys (store: apps/xiaozhi/.env)"

upstream:
  homepage: https://github.com/xinnan-tech/xiaozhi-esp32-server
  docs: https://github.com/xinnan-tech/xiaozhi-esp32-server/tree/main/docs

status:
  endpoints: http://127.0.0.1:31131
  hint: "Console: first registered user becomes the super admin; devices connect ws://<host>:31130/xiaozhi/v1/ (see: aibox xiaozhi status)"

# Pinned floor = the latest release (v0.9.6). The two ghcr images and mysql
# are pulled by the docker DAEMON (egress differs from the host's); no static
# docker_pull gate — the svc-start hook probes the daemon's direct route
# itself and, when dead/slow, pre-pulls through the ghcr mirror pool (server/
# web) + the docker.io mirror pool (mysql). deps still hard-gates the daemon.
# disk floor: server ~1.5G + web ~0.7G + mysql + optional SenseVoice model.
checks:
  disk_gb: 8
  docker_images:
    - ghcr.io/xinnan-tech/xiaozhi-esp32-server:server_0.9.6
    - ghcr.io/xinnan-tech/xiaozhi-esp32-server:web_0.9.6
    - mysql:8.0

# Component upgrades WITHOUT an aibox release: the github-release resolver
# returns the tag (v0.9.7), the engine strips the leading v (target#v), and
# the images: prefixes append it — server_0.9.7 / web_0.9.7 — which is
# EXACTLY how upstream tags its ghcr images (verified live: v0.9.6 git tag ↔
# server_0.9.6 / web_0.9.6 docker tags).
upgrade:
  source: github-release
  repo: xinnan-tech/xiaozhi-esp32-server
  images:
    - XIAOZHI_SERVER_IMAGE=ghcr.io/xinnan-tech/xiaozhi-esp32-server:server_
    - XIAOZHI_WEB_IMAGE=ghcr.io/xinnan-tech/xiaozhi-esp32-server:web_
