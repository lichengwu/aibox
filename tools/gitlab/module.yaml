name: gitlab
version: 1.5.1
description: "GitLab CE self-hosted (omnibus docker): web UI + git over SSH, embedded PG/Redis"
platform: ""
dir: tools/gitlab

deps:
  - docker
  - docker-compose

# HTTP 8929 (not 80: avoids windmill's default entry port on shared hosts);
# git-over-SSH 8922 (host) → 22 (container). Both overridable via the deploy .env.
ports:
  - 8929/tcp:http
  - 8922/tcp:git-ssh

files:
  - docker-compose.yml

# Shared library include (repo tools/_shared/<name>.sh → cached as
# _<name>.sh; lib.sh sources it). common = output helpers + docker.io pool.
includes:
  - common

hooks:
  install: install.sh
  uninstall: uninstall.sh
  update: update.sh
  svc: svc.sh

actions:
  - start
  - stop
  - restart
  - status
  - dashboard
  - logs
  - credentials
  - config

env:
  GITLAB_EXTERNAL_URL: "http://localhost:8929 — external URL GitLab renders in links"
  GITLAB_HTTP_PORT: "8929 — host HTTP port (upstream default 80 collides)"
  GITLAB_SSH_PORT: "8922 — host SSH clone port"
  GITLAB_ROOT_PASSWORD: "random — root password seeded at install; applies at first boot with fresh volumes (verify: aibox gitlab credentials) [secret]"
  GITLAB_PUMA_WORKERS: "2 — rails workers"
  GITLAB_SIDEKIQ_CONCURRENCY: "10 — background job workers"
  AIBOX_DOCKER_POOL: "shipped pool — docker.io mirror list override [knob]"
  AIBOX_DOCKER_MIRROR: "(unset) — user mirror, tried first [knob]"
  AIBOX_DOCKER_FORCE_POOL: "0 — 1 = skip the direct probe, always engage the pool [knob]"

usage:
  start: "Start the container (source pool pulls; 3-5 min first boot)"
  stop: "Stop the container"
  restart: "Recreate the container"
  status: "Container + web health + rich view"
  dashboard: "Alias of status"
  logs: "Container logs"
  credentials: "Show the seeded root password + verify it against the live account"
  config: "Show/set config keys (store: apps/gitlab/.env)"

upstream:
  homepage: https://about.gitlab.com/
  docs: https://docs.gitlab.com/omnibus/docker/

dashboard:
  endpoints: http://127.0.0.1:8929
  hint: "Login root; password: aibox gitlab credentials (seeded + verified live)"

# Component upgrades WITHOUT an aibox release (docs/module-spec.md §Component upgrades):
# `aibox upgrade gitlab` resolves the latest gitlab/gitlab-ce tag from Docker Hub
# (stable `<dotted>-ce.0` only) and floats GITLAB_IMAGE in the deploy .env. Cross-major
# (16→17→…) needs an explicit --to — GitLab requires stepping major versions.
upgrade:
  source: dockerhub-tags
  repo: gitlab/gitlab-ce
  tag_pattern: ^[0-9]+\.[0-9]+\.[0-9]+-ce\.0$
  images:
    - GITLAB_IMAGE=gitlab/gitlab-ce:

# GitLab omnibus bundles its own PostgreSQL/Redis inside the container, so this
# module does NOT consume the shared aibox base (documented in README/DEVELOPMENT).
# NOTE: no `docker_pull:` gate — the svc-start hook probes the daemon's direct
# route itself and, when it is dead, pre-pulls through the ranked docker.io
# mirror pool (see lib.sh docker_pool_prepull). A static direct-egress gate
# would false-fail exactly the mirror-saved networks. The deps check still
# hard-gates the docker DAEMON's existence.
checks:
  disk_gb: 15
  docker_images:
    - gitlab/gitlab-ce:19.2.6-ce.0
