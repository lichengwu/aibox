# gitlab deploy compose — placed into $AIBOX_HOME/apps/gitlab by the install
# hook. Conventions (docs/module-spec.md §Deploy directory): named volumes only
# (Docker Desktop does not share /opt — bind mounts there fail with "Mounts
# denied"); no hardcoded credentials; ports/image tunables via the deploy .env.
#
# Single-instance module: fixed container name + project-scoped volumes
# (gitlab_gitlab_config / _logs / _data). GitLab omnibus bundles its own
# PostgreSQL + Redis inside the container — intentionally NOT the shared aibox
# base (the upstream docker distribution is supported with embedded services;
# external-PG omnibus setups are out of scope for this module).
services:
  gitlab:
    image: ${GITLAB_IMAGE:-gitlab/gitlab-ce:19.2.6-ce.0}
    container_name: aibox-gitlab
    restart: unless-stopped
    shm_size: 256m
    ports:
      # host port == container port (external_url must match what nginx listens on)
      - "${GITLAB_HTTP_PORT:-8929}:${GITLAB_HTTP_PORT:-8929}"
      # git-over-SSH: host 8922 → container 22 (gitlab-shell keeps listening on 22)
      - "${GITLAB_SSH_PORT:-8922}:22"
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url '${GITLAB_EXTERNAL_URL:-http://localhost:8929}'
        nginx['listen_port'] = ${GITLAB_HTTP_PORT:-8929}
        nginx['listen_https'] = false
        prometheus_monitoring['enable'] = false
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-8922}
        puma['worker_processes'] = ${GITLAB_PUMA_WORKERS:-2}
        sidekiq['max_concurrency'] = ${GITLAB_SIDEKIQ_CONCURRENCY:-10}
        postgresql['shared_buffers'] = '256MB'
      # NOTE: no grafana['enable']/alertmanager['enable'] here — GitLab 19.x
      # REMOVED those omnibus options; setting them makes reconfigure FATAL
      # ("Reading unsupported config value grafana", measured live on 19.2.6).
      # prometheus_monitoring['enable']=false is the supported master switch.
    healthcheck:
      test: ["CMD", "/opt/gitlab/bin/gitlab-healthcheck", "--fail", "--max-time", "10"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s

volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
