# gitlab deploy compose — placed into $AIBOX_HOME/apps/gitlab by the install
# hook. Conventions (docs/module-spec.md §Deploy directory): named volumes only
# (Docker Desktop does not share /opt — bind mounts there fail with "Mounts
# denied"); no hardcoded credentials; ports/image tunables via the deploy .env.
#
# Single-instance module: fixed container name + project-scoped volumes
# (gitlab_gitlab_config / _logs / _data). GitLab omnibus bundles its own
# PostgreSQL + Redis inside the container — intentionally NOT the shared aibox
# base (the upstream docker distribution is supported with embedded services;
# external-PG omnibus setups are out of scope for this module).
services:
  gitlab:
    image: ${GITLAB_IMAGE:-gitlab/gitlab-ce:19.2.6-ce.0}
    container_name: aibox-gitlab
    restart: unless-stopped
    shm_size: 256m
    ports:
      # host port == container port (external_url must match nginx's listener)
      - "${GITLAB_HTTP_PORT:-31110}:${GITLAB_HTTP_PORT:-31110}"
      # git-over-SSH: host port -> container 22 (gitlab-shell listens on 22)
      - "${GITLAB_SSH_PORT:-31222}:22"
      # HTTPS: bound only when GITLAB_HTTPS_ENABLE=true. The port must equal
      # the one in external_url (omnibus derives nginx's TLS listener there),
      # so 443 + https://host is the normal setup.
      - "${GITLAB_HTTPS_PORT:-31143}:${GITLAB_HTTPS_PORT:-31143}"
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
      # Operator-owned certs (never overwritten by hooks: state_files: ssl/).
      # Real certs drop in as gitlab.crt (+chain) / gitlab.key; when HTTPS is
      # on and the dir is empty, `aibox gitlab start` self-signs a pair.
      - ./ssl:/etc/gitlab/ssl:ro
    environment:
      # Seeded root password (lib.sh ensure_root_password guarantees the .env
      # carries it before any aibox-driven up; ENV wins over omnibus random
      # generation and applies at FIRST boot with fresh volumes — pre-seeded
      # volumes ignore it, which `aibox gitlab credentials` detects by
      # verifying against the live account). The :- default keeps direct
      # `docker compose up` (bypassing aibox) from erroring on an unset var.
      GITLAB_ROOT_PASSWORD: "${GITLAB_ROOT_PASSWORD:-}"
      GITLAB_OMNIBUS_CONFIG: |
        external_url '${GITLAB_EXTERNAL_URL:-http://localhost:31110}'
        # listen_port is the port nginx's EXTERNAL protocol listens on: with
        # external_url https://… that is the TLS port — setting the plain HTTP
        # port here makes nginx create two default servers on 80 ("duplicate
        # default server for 0.0.0.0:80", live-caught) and nginx never starts.
        nginx['listen_port'] = ${GITLAB_NGINX_LISTEN_PORT:-31110}
        nginx['listen_https'] = ${GITLAB_HTTPS_ENABLE:-false}
        nginx['ssl_certificate'] = '/etc/gitlab/ssl/gitlab.crt'
        nginx['ssl_certificate_key'] = '/etc/gitlab/ssl/gitlab.key'
        nginx['redirect_http_to_https'] = ${GITLAB_HTTPS_REDIRECT:-false}
        prometheus_monitoring['enable'] = false
        gitlab_rails['gitlab_shell_ssh_port'] = ${GITLAB_SSH_PORT:-31222}
        puma['worker_processes'] = ${GITLAB_PUMA_WORKERS:-2}
        sidekiq['max_concurrency'] = ${GITLAB_SIDEKIQ_CONCURRENCY:-10}
        postgresql['shared_buffers'] = '256MB'
        # Local-only readiness endpoint (for aibox upgrade's per-hop gate: the
        # /-/readiness probe includes the db-migrations checks; without this
        # whitelist omnibus rejects the probe with 401). 127.0.0.1 only --
        # never exposed externally (the port mapping is host-scoped anyway).
        gitlab_rails['monitoring_whitelist'] = ['127.0.0.1']
      # NOTE: no grafana['enable']/alertmanager['enable'] here — GitLab 19.x
      # REMOVED those omnibus options; setting them makes reconfigure FATAL
      # ("Reading unsupported config value grafana", measured live on 19.2.6).
      # prometheus_monitoring['enable']=false is the supported master switch.
    healthcheck:
      test:
        - CMD
        - /opt/gitlab/bin/gitlab-healthcheck
        - --fail
        - --max-time
        - "10"
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 300s

volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
