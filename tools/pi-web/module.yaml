name: pi-web
version: 1.0.0
description: "Deploy @agegr/pi-web as a launchd/systemd service (HTTP Basic auth, auto-restart)"
platform: ""
dir: tools/pi-web

deps:
  - "node:22"
  - npm

ports:
  - 30141/tcp:http

# Preflight (enforced by aibox install/update; see docs/module-spec.md).
# pi-web is installed from the npm registry; the user-level service manager
# (launchd on macOS, systemd --user on Linux) must exist for start/enable.
checks:
  disk_gb: 2
  domains:
    - registry.npmjs.org
  commands:
    - launchctl@darwin
    - systemctl@linux

hooks:
  install: install.sh
  uninstall: uninstall.sh
  update: update.sh
  svc: svc.sh

actions:
  - start
  - stop
  - restart
  - status
  - logs
  - diagnose

upstream:
  homepage: https://github.com/agegr/pi-web
  docs: https://github.com/agegr/pi-web#readme
  install: https://github.com/agegr/pi-web#installation
  test: https://github.com/agegr/pi-web#development

dashboard:
  endpoints:
    - "http://127.0.0.1:${PORT}"
  hint: "Username pi / password: see `aibox pi-web status` (plist PI_WEB_PASSWORD)"
