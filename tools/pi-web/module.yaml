name: pi-web
version: 1.3.3
description: "Deploy @agegr/pi-web as a launchd/systemd service (HTTP Basic auth, auto-restart)"
platform: ""
dir: tools/pi-web

deps:
  - "node:22"
  - npm

ports:
  - 30141/tcp:http

# Preflight (enforced by aibox install/update; see docs/module-spec.md).
# The user-level service manager (launchd on macOS, systemd --user on Linux) must
# exist for start/enable. NOTE: no `domains:` gate on the npm registry — the install
# hook itself probes registry.npmjs.org + the CN mirrors in parallel and adopts the
# fastest (with a stall watchdog + failover); a static npmjs-only reachability gate
# would false-fail exactly the mirror-saved networks (measured: npmjs metadata 4.3s
# vs 0.15s on npmmirror, worse cases hang).
checks:
  disk_gb: 2
  commands:
    - launchctl@darwin
    - systemctl@linux

# Shared library include (repo tools/_shared/<name>.sh → cached as
# _<name>.sh; lib.sh sources it). common = output helpers + docker.io pool.
includes:
  - common

hooks:
  install: install.sh
  uninstall: uninstall.sh
  update: update.sh
  svc: svc.sh

actions:
  - start
  - stop
  - restart
  - status
  - dashboard
  - logs
  - diagnose

usage:
  start: "Start the launchd/systemd service"
  stop: "Stop the service"
  restart: "Recreate the service (applies config changes)"
  status: "Service + HTTP health + rich view"
  dashboard: "Alias of status"
  logs: "Follow the app log"
  diagnose: "Self-check (port/auth/process/log)"

upstream:
  homepage: https://github.com/agegr/pi-web
  docs: https://github.com/agegr/pi-web#readme
  install: https://github.com/agegr/pi-web#installation
  test: https://github.com/agegr/pi-web#development

dashboard:
  endpoints:
    - "http://127.0.0.1:${PORT}"
  hint: "Username pi / password: see `aibox pi-web status` (plist PI_WEB_PASSWORD)"
