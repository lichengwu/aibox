# OpenMAIC compose override — connect to the shared aibox base PG.
#
# This file is the repo REFERENCE copy — the openmaic CLI writes identical content to
# $APP_DIR/docker-compose.shared.yml when OPENMAIC_SHARED_PG=1 (see the CLI's
# _shared_override_write heredoc). CI job `shared-override-sync` enforces that the
# functional content stays in sync (comments excluded).
# Manual use: cp this file to $APP_DIR/docker-compose.shared.yml — the CLI detects it
# and appends it with -f in compose calls (openmaic up/install/upgrade/backup, etc.).
#
# Shared PG mode (avoids a per-module PG, saving resources):
#   1. aibox base start && aibox base create postgres openmaic
#      (during install, if the base PG container is running, the CLI auto-CREATE DATABASEs openmaic)
#   2. Enable shared mode: write OPENMAIC_SHARED_PG=1 to /etc/openmaic/openmaic.conf
#      (or temporarily: OPENMAIC_SHARED_PG=1 openmaic install)
#   3. openmaic install / up — the CLI drops this file + creates the openmaic DB + starts
#      the app connected to the shared PG.
#
# Downgrade (back to standalone PG): set OPENMAIC_SHARED_PG=0 then openmaic up (the CLI
# removes the override).
#
# Principle: postgres replicas:0 (no local PG started); the openmaic app joins the shared
#       base network (key aiboxbasenet → actual network name ${AIBOX_BASE_NETWORK:-aibox-base},
#       profile-aware) and connects via the service name in ${AIBOX_POSTGRES_HOST}; the
#       DATABASE_URL is built from ${AIBOX_POSTGRES_*} — values are injected from
#       $AIBOX_HOME/base[-profile].env via compose --env-file (it overrides DATABASE_URL in
#       .env.local — environment takes precedence over env_file).
#       .env.local must still exist (PERSISTENCE_DEV_TOKEN, API Key, ACCESS_CODE, etc.);
#       only its DATABASE_URL is overridden by this file.
#       render-service is left untouched — it sits on the internal: true render network;
#       joining the base network would break its egress isolation (untrusted Chromium
#       could reach the shared PG).
#
# Verify: docker compose --env-file $AIBOX_HOME/base.env --profile server-persistence \
#         -f docker-compose.yml -f docker-compose.shared.yml config
services:
  postgres:
    deploy:
      replicas: 0

  openmaic:
    depends_on: []
    networks:
      - default
      - render
      - aiboxbasenet
    environment:
      - DATABASE_URL=postgres://${AIBOX_POSTGRES_USER}:${AIBOX_POSTGRES_PASSWORD}@${AIBOX_POSTGRES_HOST}:${AIBOX_POSTGRES_PORT}/openmaic

networks:
  aiboxbasenet:
    name: ${AIBOX_BASE_NETWORK:-aibox-base}
    external: true
