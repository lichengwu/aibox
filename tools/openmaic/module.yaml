name: openmaic
version: 1.2.0
description: "OpenMAIC ops CLI (install/upgrade/backup/doctor)"
platform: ""
dir: tools/openmaic

deps:
  - docker
  - docker-compose
  - git

ports:
  - 3000/tcp:app
  - 5432/tcp:postgres

files:
  - cli/openmaic

services:
  - base:postgres#openmaic

# Preflight (enforced by aibox install/update; see docs/module-spec.md).
# github.com (host git/curl) = source clone/fetch (THU-MAIC/OpenMAIC). Compose
# base images are pulled by the docker DAEMON (own egress: mirrors/proxy) →
# probed daemon-routed via hello-world, not host curl. Disk: source tree +
# docker build (the render-service Chromium layer is heavy) + pg_data growth.
checks:
  disk_gb: 20
  domains:
    - github.com
  docker_pull: hello-world

hooks:
  install: install.sh
  uninstall: uninstall.sh
  update: update.sh
  svc: svc.sh

actions:
  - status
  - dashboard
  - health
  - doctor
  - version
  - up
  - down
  - restart
  - logs
  - render
  - upgrade
  - rollback
  - backup
  - restore
  - db
  - config
  - models
  - install
  - clean
  - powerlog
  - url

usage:
  status: "Version / health / containers / resources overview"
  dashboard: "Same as status (dispatched to the CLI)"
  health: "[--wait N] — health check (exit code is probe-friendly)"
  doctor: "Environment self-check"
  version: "[--check] — version info / upstream release check"
  up: "Start the stack"
  down: "Stop the stack"
  restart: "Restart the stack"
  logs: "Container logs"
  render: "Regenerate app config (secrets unchanged)"
  upgrade: "Pull latest images + redeploy (auto-backup)"
  rollback: "Restore the auto-backup taken before upgrade"
  backup: "Snapshot data volumes to a tar archive"
  restore: "Restore volumes from a backup archive"
  db: "Shell into the app database (psql)"
  config: "Edit the openmaic.conf (vi/nano)"
  models: "Model catalog management (list/enable)"
  install: "(Dispatched) Bootstrap components on the deploy host"
  clean: "Remove stopped containers + dangling images"
  powerlog: "Power-log query/analysis tools"
  url: "Print the web entry points"

upstream:
  homepage: https://github.com/THU-MAIC/OpenMAIC
  docs: https://github.com/THU-MAIC/OpenMAIC#readme

dashboard:
  endpoints:
    - "http://127.0.0.1:${PORT}"
  hint: "Credentials in .env.local; DATABASE_URL built by shared.yml from ${AIBOX_POSTGRES_*} (injected via base.env)"
