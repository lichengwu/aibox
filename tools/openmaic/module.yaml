name: openmaic
version: 1.0.0
description: "OpenMAIC ops CLI (install/upgrade/backup/doctor)"
platform: ""
dir: tools/openmaic

deps:
  - docker
  - docker-compose
  - git

ports:
  - 3000/tcp:app
  - 5432/tcp:postgres

files:
  - cli/openmaic

services:
  - base:postgres#openmaic

hooks:
  install: install.sh
  uninstall: uninstall.sh
  update: update.sh
  svc: svc.sh

actions:
  - status
  - health
  - doctor
  - version
  - up
  - down
  - restart
  - logs
  - render
  - upgrade
  - rollback
  - backup
  - restore
  - db
  - config
  - models
  - install
  - clean
  - powerlog
  - url

upstream:
  homepage: https://github.com/THU-MAIC/OpenMAIC
  docs: https://github.com/THU-MAIC/OpenMAIC#readme

dashboard:
  endpoints:
    - "http://127.0.0.1:${PORT}"
  hint: "Credentials in .env.local; DATABASE_URL built by shared.yml from ${AIBOX_POSTGRES_*} (injected via base.env)"
