name: openmaic
version: 1.7.11
module_iface: 1
description: "OpenMAIC ops CLI (install/upgrade/backup/doctor)"
platform: ""
dir: tools/openmaic

deps:
  - docker
  - docker-compose
  - git

ports:
  - 31140/tcp:app
# NOTE: no 5432 entry — upstream's postgres service has no host port mapping
# (internal to the compose network; shared mode uses the base PG). A declared
# port is shown by `aibox status` and reserved by the port-conflict check,
# so declaring one nothing publishes is drift (caught by tests/docs-config-drift.bats).

files:
  - cli/openmaic
state_files:
  - .env

services:
  - base:postgres#openmaic

# Preflight (enforced by aibox install/update; see docs/module-spec.md).
# github.com (host git/curl) = source clone/fetch (THU-MAIC/OpenMAIC). Compose
# base images are pulled by the docker DAEMON (own egress: mirrors/proxy) →
# probed daemon-routed via hello-world, not host curl. Disk: source tree +
# docker build (the render-service Chromium layer is heavy) + pg_data growth.
# `aibox install openmaic` installs THE MODULE (fast); the APP is built from source on
# the deploy host, so `start` triggers the deploy on demand and says so first.
# (≠ `aibox openmaic install`, which is that deploy itself: clone + build + start.)
first_run: install
first_run_note: "clone + build from source (render-service Chromium layer is heavy; up to ~1h, needs ~20G free)"
checks:
  disk_gb: 20
  domains:
    - github.com
  docker_pull: hello-world

# Shared library include (repo tools/_shared/<name>.sh → cached as
# _<name>.sh; lib.sh sources it). common = output helpers + docker.io pool.
includes:
  - common

hooks:
  install: install.sh
  uninstall: uninstall.sh
  update: update.sh
  svc: svc.sh

actions:
  - start
  - stop
  - status
  - health
  - doctor
  - version
  - up
  - down
  - restart
  - logs
  - render
  - upgrade
  - rollback
  - backup
  - restore
  - db
  - config
  - models
  - install
  - clean
  - powerlog
  - url

env:
  OPENMAIC_PROXY_URL: "(unset) — proxy for pulling source (synced by aibox proxy set; store: /etc/openmaic/openmaic.conf)"
  OPENMAIC_BIN_DIR: "${AIBOX_BIN_DIR:-~/.local/bin} — install target of the dispatched CLI [knob]"
  OPENMAIC_CONF_DIR: "/etc/openmaic — conf file location [knob]"
  OPENMAIC_TAG: "(unset) — pin the deployed version (e.g. v1.1.2); start then passes --tag and needs no release lookup [knob]"
  OPENMAIC_FETCH_TIMEOUT: "240 — seconds cap per fetch attempt (a throttled link must not burn the whole window on one try) [knob]"
  OPENMAIC_FETCH_ATTEMPTS: "4 — source fetch attempts per channel; later ones shallow (resumable on throttled links) [knob]"
  OPENMAIC_APP_PORT: "3000 — container-internal app port; the CLI probes the PUBLISHED host port automatically [knob]"
  OPENMAIC_ACCESS_CODE: "(unset) — access code for a FIRST-RUN bootstrap (else generated and printed); set it in /etc/openmaic/openmaic.conf [secret]"
  OPENMAIC_BASE_DIR: "$AIBOX_HOME/apps/openmaic — deploy root [knob]"
  OPENMAIC_HEALTH_URL: "http://127.0.0.1:31140/api/health — health probe URL (host port; container stays 3000) [knob]"
  OPENMAIC_HEALTH_TIMEOUT: "300 — health-wait seconds [knob]"
  OPENMAIC_BACKUP_KEEP: "14 — backup retention count [knob]"
  OPENMAIC_RENDER_ENABLED: "1 — render component switch [knob]"
  OPENMAIC_SHARED_PG: "0 — 1 = use the aibox shared base PG [knob]"
  OPENMAIC_PROXY_HOST: "(unset) — proxy host for build-time source pulls [knob]"
  OPENMAIC_BUILD_TIMEOUT_MAIN: "3600 — main image build timeout seconds [knob]"
  OPENMAIC_BUILD_TIMEOUT_RENDER: "2400 — render image build timeout seconds [knob]"

residue:
  bin: openmaic
  paths:
    - "$ETC_DIR/openmaic"
  containers: "^app-(openmaic|postgres|render-service)-[0-9]+$"
  volumes: "^app_openmaic"
usage:
  status: "Version / health / containers / resources overview"
  start: "Alias of up (deploy first: aibox openmaic install)"
  stop: "Alias of down (standard lifecycle)"
  health: "[--wait N] — health check (exit code is probe-friendly)"
  doctor: "Environment self-check"
  version: "[--check] — version info / upstream release check"
  up: "Start the stack (requires the app to be deployed: aibox openmaic install)"
  down: "Stop the stack"
  restart: "Restart the stack"
  logs: "Container logs"
  render: "Regenerate app config (secrets unchanged)"
  upgrade: "Pull latest images + redeploy (auto-backup)"
  rollback: "Restore the auto-backup taken before upgrade"
  backup: "Snapshot data volumes to a tar archive"
  restore: "Restore volumes from a backup archive"
  db: "Shell into the app database (psql)"
  config: "Edit the openmaic.conf (vi/nano)"
  models: "Model catalog management (list/enable)"
  install: "Deploy OpenMAIC itself — clone + build + start (≠ aibox install openmaic, which installs this module)"
  clean: "Remove stopped containers + dangling images"
  powerlog: "Power-log query/analysis tools"
  url: "Print the web entry points"

upstream:
  homepage: https://github.com/THU-MAIC/OpenMAIC
  docs: https://github.com/THU-MAIC/OpenMAIC#readme

status:
  endpoints:
    - "http://127.0.0.1:${PORT}"
  hint: "Credentials in .env.local; DATABASE_URL built by shared.yml from ${AIBOX_POSTGRES_*} (injected via base.env)"
