name: clash
version: 1.3.2
description: "Clash subscription proxy pool — mihomo kernel orchestration (auto speed-test/switch/failover)"
platform: ""
dir: tools/clash

ports:
  - 7890/tcp:mixed
  - 9090/tcp:api

# Preflight (enforced by aibox install/update; see docs/module-spec.md).
# NOTE: no `domains:` gate — the install hook itself races the download source
# pool (CLASH_MIRROR/AIBOX_GH_MIRROR + gh-proxy.com + ghproxy.net + DIRECT,
# rate-probed on the actual release asset; see lib.sh). A static
# github-only reachability gate would false-fail exactly the mirror-saved
# networks. The subscription URL is user-supplied and fetched by mihomo with
# its own UA — plain-curl probes return 403 by design, so it stays unchecked.
checks:
  disk_gb: 1

# Shared library include (repo tools/_shared/<name>.sh → cached as
# _<name>.sh; lib.sh sources it). common = output helpers + docker.io pool.
includes:
  - common

hooks:
  install: install.sh
  uninstall: uninstall.sh
  update: update.sh
  svc: svc.sh

actions:
  - start
  - stop
  - restart
  - status
  - dashboard
  - refresh
  - set
  - select
  - test
  - logs
  - doctor
  - use-external
  - internal

usage:
  start: "Start the mihomo kernel + switch aibox egress"
  stop: "Stop the kernel (egress falls back)"
  restart: "Stop + start"
  status: "Kernel + subscription state"
  dashboard: "State + nodes + latency table"
  refresh: "Force-refresh the subscription (auto: 1 week)"
  set: "<subscription-url> — store the subscription + generate config"
  select: "<node-name> — switch the active node"
  test: "[url] — probe connectivity via the current node"
  logs: "Follow the mihomo log"
  doctor: "Self-check (binary/config/subscription/kernel)"
  use-external: "[port] — reuse a local clash client (Verge etc.) as the aibox egress"
  internal: "Revert to aibox-managed mihomo (from external mode)"

upstream:
  homepage: https://github.com/MetaCubeX/mihomo
  docs: https://wiki.metacubex.one/

dashboard:
  endpoints:
    - "mixed: socks5://127.0.0.1:7890  api: http://127.0.0.1:9090"
  hint: "Egress socks5://127.0.0.1:7890; API 127.0.0.1:9090 (state CLASH_SECRET)"
