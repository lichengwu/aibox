name: clash
version: 1.0.0
description: "Clash subscription proxy pool — mihomo kernel orchestration (auto speed-test/switch/failover)"
platform: ""
dir: tools/clash

ports:
  - 7890/tcp:mixed
  - 9090/tcp:api

# Preflight (enforced by aibox install/update; see docs/module-spec.md).
# The mihomo binary comes from GitHub releases (CLASH_MIRROR env overrides the
# download base when GitHub is blocked). The subscription URL itself is
# user-supplied and fetched by mihomo with its own UA — plain-curl probes of it
# return 403 by design, so it is deliberately NOT a checked domain.
checks:
  disk_gb: 1
  domains:
    - api.github.com
    - github.com

hooks:
  install: install.sh
  uninstall: uninstall.sh
  update: update.sh
  svc: svc.sh

actions:
  - start
  - stop
  - restart
  - status
  - refresh
  - set
  - select
  - test
  - logs
  - doctor

upstream:
  homepage: https://github.com/MetaCubeX/mihomo
  docs: https://wiki.metacubex.one/

dashboard:
  endpoints:
    - "mixed: socks5://127.0.0.1:7890  api: http://127.0.0.1:9090"
  hint: "Egress socks5://127.0.0.1:7890; API 127.0.0.1:9090 (state CLASH_SECRET)"
