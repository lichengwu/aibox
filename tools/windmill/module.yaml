name: windmill
version: 1.3.0
description: "Windmill self-host ops CLI (init/upgrade/backup/drill/doctor)"
platform: ""
dir: tools/windmill

deps:
  - docker
  - docker-compose
  - python3

ports:
  # windmill CLI default HTTP_PORT=80 (env-overridable at init)
  - 80/tcp:http

files:
  - cli/windmill

services:
  - base:postgres#windmill
  - base:redis

# Preflight (enforced by aibox install/update; see docs/module-spec.md).
# All windmill/caddy images come from ghcr.io — host-probed here (no canonical
# tiny ghcr image exists for a daemon-routed pull probe; on typical Linux
# deploy hosts daemon and host share egress). The disk floor matches the CLI's
# own doctor contract (>=12G; live images alone measured ~9.5G). Shared-PG mode
# needs no docker.io pull — base provides postgres (db replicas are 0).
checks:
  disk_gb: 12
  domains:
    - ghcr.io

hooks:
  install: install.sh
  uninstall: uninstall.sh
  update: update.sh
  svc: svc.sh

actions:
  - start
  - stop
  - restart
  - status
  - dashboard
  - logs
  - shell
  - credentials
  - systemd
  - destroy
  - backup
  - upgrade
  - rollback
  - check
  - deploy
  - restore
  - drill
  - snapshots
  - init

usage:
  start: "Start the stack (docker compose up -d)"
  stop: "Stop the stack"
  restart: "Recreate containers"
  status: "Stack health + version info"
  dashboard: "Same as status (dispatched to the CLI)"
  logs: "Container logs"
  shell: "Open a shell in the server container"
  credentials: "Show admin + database credentials"
  systemd: "Manage the systemd backup/update timers"
  destroy: "Tear down the deployment (dangerous; needs confirm)"
  backup: "Snapshot data volumes"
  upgrade: "Pull latest + redeploy with auto-backup"
  rollback: "Restore the pre-upgrade backup"
  check: "Readiness / consistency self-check"
  deploy: "Deploy a specific tag (rollback pointer)"
  restore: "Restore volumes from a backup"
  drill: "Practice the disaster-recovery path (no-op run)"
  snapshots: "List / manage volume snapshots"
  init: "First-time init (secrets + config generation)"

upstream:
  homepage: https://github.com/windmill-labs/windmill
  docs: https://www.windmill.dev/docs/

dashboard:
  endpoints:
    - "http://127.0.0.1:${PORT}"
  hint: "Credentials in CREDENTIALS.txt + .env; DB connects to shared PG via ${AIBOX_POSTGRES_HOST} (injected via base.env)"
