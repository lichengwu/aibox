name: windmill
version: 1.1.0
description: "Windmill self-host ops CLI (init/upgrade/backup/drill/doctor)"
platform: ""
dir: tools/windmill

deps:
  - docker
  - docker-compose
  - python3

ports:
  - 8080/tcp:http

files:
  - windmill

services:
  - base:postgres#windmill
  - base:redis

hooks:
  install: install.sh
  uninstall: uninstall.sh
  update: update.sh
  svc: svc.sh

actions:
  - start
  - stop
  - restart
  - status
  - logs
  - shell
  - credentials
  - systemd
  - destroy
  - backup
  - upgrade
  - rollback
  - check
  - deploy
  - restore
  - drill
  - snapshots
  - init

upstream:
  homepage: https://github.com/windmill-labs/windmill
  docs: https://www.windmill.dev/docs/

dashboard:
  endpoints:
    - "http://127.0.0.1:${PORT}"
  hint: "凭据见 CREDENTIALS.txt + .env；DB 经 ${AIBOX_POSTGRES_HOST} 连共享 PG（base.env 注入）"
