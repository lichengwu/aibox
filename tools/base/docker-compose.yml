# aibox 共享基础组件：PostgreSQL 18 + Redis 7
# 各模块连共享实例（network aibox-base + env 指向 host:35432），init 时建自己的库（<module> 或 <module>_<用途>）
services:
  pg:
    image: postgres:18
    container_name: aibox-base-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AIBOX_BASE_PG_USER:-aibox}
      POSTGRES_PASSWORD: ${AIBOX_BASE_PG_PASSWORD:-aibox}
      POSTGRES_DB: aibox
    ports:
      - "35432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    networks:
      - aibox-base

  redis:
    image: redis:7
    container_name: aibox-base-redis
    restart: unless-stopped
    ports:
      - "36379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aibox-base

volumes:
  pg_data:
  redis_data:

networks:
  aibox-base:
    name: aibox-base
