# aibox shared base components: PostgreSQL 18 + Redis 7
# Modules connect to the shared instance (network aibox-base + env pointing at
# aibox-base-postgres) and create their own DB (<module> or <module>_<usage>) at init.
# Connection info is written to $AIBOX_HOME/base.env by `base start`; consuming modules
# inject it via compose --env-file.
#
# All names/ports are parameterized via ${VAR:-default}. The "base" profile (default)
# uses the defaults below; named profiles (AIBOX_PROFILE=<name>) override via env vars
# exported by lib.sh's _profile_load.
#
# IMAGE PINS: the tags come from the deploy-root .env (${AIBOX_BASE_*_IMAGE:-floor}),
# so `aibox base upgrade --pg <tag>` can float them without touching this file
# (which a module update overwrites).
# PORT BIND: published on ${AIBOX_BASE_BIND:-127.0.0.1} — consumers only need the
# compose network (service name:5432), the host publish is for the operator; the
# old all-interfaces default exposed an admin DB (and a Redis with a default-weak
# story) to the network.
services:
  postgres:
    image: ${AIBOX_BASE_PG_IMAGE:-postgres:18}
    container_name: ${AIBOX_BASE_PG_CONTAINER:-aibox-base-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AIBOX_BASE_POSTGRES_USER:-aibox}
      POSTGRES_PASSWORD: ${AIBOX_BASE_POSTGRES_PASSWORD:-aibox}
      POSTGRES_DB: aibox
    ports:
      - "${AIBOX_BASE_BIND:-127.0.0.1}:${AIBOX_BASE_POSTGRES_PORT:-35432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIBOX_BASE_POSTGRES_USER:-aibox}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    volumes:
      # Mounted at the PARENT dir on purpose: postgres:17+ images use
      # PGDATA=/var/lib/postgresql/<ver>/docker and declare VOLUME /var/lib/postgresql,
      # so a named volume here covers the real data dir across major-version layout changes.
      - pg_data:/var/lib/postgresql
    networks:
      - default

  redis:
    image: ${AIBOX_BASE_REDIS_IMAGE:-redis:7}
    container_name: ${AIBOX_BASE_REDIS_CONTAINER:-aibox-base-redis}
    restart: unless-stopped
    # Auth is ON: the password is generated once (or taken from the operator) and
    # published in base.env as AIBOX_REDIS_PASSWORD; consumers inject it.
    command: ["redis-server", "--requirepass", "${AIBOX_BASE_REDIS_PASSWORD}", "--save", "60", "1"]
    ports:
      - "${AIBOX_BASE_BIND:-127.0.0.1}:${AIBOX_BASE_REDIS_PORT:-36379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$AIBOX_BASE_REDIS_PASSWORD\" PING | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      AIBOX_BASE_REDIS_PASSWORD: ${AIBOX_BASE_REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - default

volumes:
  # Explicit names: deterministic regardless of deploy dir / compose project name.
  # "base" profile → aibox_pg_data; named profile → aibox_pg_data_<name> (via env var).
  pg_data:
    name: ${AIBOX_BASE_PG_VOLUME:-aibox_pg_data}
  redis_data:
    name: ${AIBOX_BASE_REDIS_VOLUME:-aibox_redis_data}

networks:
  default:
    name: ${AIBOX_BASE_NETWORK:-aibox-base}
