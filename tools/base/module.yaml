name: base
version: 1.10.3
module_iface: 1
description: "Shared base components (PostgreSQL 18 + Redis 7); each module gets its own DB"
platform: ""
dir: tools/base

deps:
  - docker
  - docker-compose

provides:
  - postgres
  - redis

ports:
  - 32432/tcp:postgres
  - 32379/tcp:redis

files:
  - docker-compose.yml
  - lib-upgrade.sh
state_files:
  - .env

# Preflight (enforced by aibox install/update; see docs/module-spec.md).
# Images are pulled by the docker DAEMON (whose egress differs from the host's —
# host-curl probes of registry-1.docker.io are unreliable), so the pull path is
# probed daemon-routed via hello-world; when both real images are already
# cached the probe is skipped and offline restarts pass.
# NOTE: no `docker_pull:` gate — the svc-start hook probes the daemon's direct
# route itself and, when it is dead, pre-pulls through the ranked docker.io
# mirror pool (see lib.sh docker_pool_prepull). A static direct-egress gate
# would false-fail exactly the mirror-saved networks. The deps check still
# hard-gates the docker DAEMON's existence.
checks:
  disk_gb: 3
  docker_images:
    - postgres:18
    - redis:7

# Shared library include (repo tools/_shared/<name>.sh → cached as
# _<name>.sh; lib.sh sources it). common = output helpers + docker.io pool.
includes:
  - common

hooks:
  install: install.sh
  uninstall: uninstall.sh
  update: update.sh
  svc: svc.sh

actions:
  - start
  - stop
  - restart
  - status
  - doctor
  - logs
  - create
  - dump
  - restore
  - upgrade
  - profile
  - config

env:
  AIBOX_BASE_POSTGRES_PORT: "32432 — host PostgreSQL port (infra band; profiles derive 32100+h%332)"
  AIBOX_BASE_POSTGRES_USER: "aibox — PG superuser (consuming modules get it via base.env)"
  AIBOX_BASE_POSTGRES_PASSWORD: "aibox — PG password (override via this key; consumers read base.env) [secret]"
  AIBOX_BASE_PG_IMAGE: "postgres:18 — postgres image pin (floated by `aibox base upgrade --pg`; written to the deploy-root .env)"
  AIBOX_BASE_REDIS_IMAGE: "redis:7 — redis image pin (floated by `aibox base upgrade --redis`)"
  AIBOX_BASE_REDIS_PASSWORD: "(generated) — Redis auth password (published in base.env as AIBOX_REDIS_PASSWORD)"
  AIBOX_BASE_BIND: "127.0.0.1 — host interface the ports bind to (use 0.0.0.0 only when a remote host must reach them)"
  AIBOX_BASE_REDIS_PORT: "32379 — host Redis port (infra band; profiles derive 32600+h%279)"
  AIBOX_DOCKER_POOL: "shipped pool — docker.io mirror list override (direct = off) [knob]"
  AIBOX_DOCKER_MIRROR: "(unset) — user mirror, tried first [knob]"
  AIBOX_DOCKER_FORCE_POOL: "0 — 1 = skip the direct probe, always engage the pool [knob]"

residue:
  containers: "^aibox-base(-[A-Za-z0-9]+)?-(postgres|redis)$"
  volumes: "^aibox_(pg|redis)_data"
usage:
  start: "Start shared PG + Redis"
  stop: "Stop containers (data preserved)"
  restart: "Stop + start"
  status: "Container states + PG/Redis rich view"
  doctor: "Deep diagnostics: deps, docker, state, declared ports"
  logs: "Container logs"
  create: "<component> <resource> — create a resource (e.g. create postgres dify)"
  dump: "Full pg_dumpall + Redis snapshot of the shared data (safety net before upgrades)"
  restore: "<file> — restore a dump (REPLACES all shared data; default: newest)"
  upgrade: "[--check | --pg <tag> | --redis <tag> | --rollback] — float the infra image pins (dump → pin → health gate → rollback), state shared with `aibox upgrade base`"
  profile: "List named profiles"
  config: "Show/set config keys (store: base.env)"

upstream:
  homepage: https://www.postgresql.org/
  docs: https://www.postgresql.org/docs/

status:
  endpoints:
    - "postgres: postgres://127.0.0.1:32432  redis: redis://127.0.0.1:32379"
  hint: "aibox base create postgres <module> to create a DB; connection info in $AIBOX_HOME/base.env"
