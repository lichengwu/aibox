name: base
version: 1.0.0
description: "Shared base components (PostgreSQL 18 + Redis 7); each module gets its own DB"
platform: ""
dir: tools/base

deps:
  - docker
  - docker-compose

provides:
  - postgres
  - redis

ports:
  - 35432/tcp:postgres
  - 36379/tcp:redis

files:
  - docker-compose.yml

hooks:
  install: install.sh
  uninstall: uninstall.sh
  update: update.sh
  svc: svc.sh

actions:
  - start
  - stop
  - restart
  - status
  - logs
  - createdb

upstream:
  homepage: https://www.postgresql.org/
  docs: https://www.postgresql.org/docs/

dashboard:
  endpoints:
    - "postgres: postgres://127.0.0.1:35432  redis: redis://127.0.0.1:36379"
  hint: "aibox base createdb <module> to create a DB; connection info in $AIBOX_HOME/base.env"
