name: base
version: 1.0.0
description: "共享基础组件（PostgreSQL 18 + Redis 7），各模块独立数据库"
platform: ""
dir: tools/base

deps:
  - docker
  - docker-compose

provides:
  - postgres
  - redis

ports:
  - 35432/tcp:postgres
  - 36379/tcp:redis

files:
  - docker-compose.yml

hooks:
  install: install.sh
  uninstall: uninstall.sh
  update: update.sh
  svc: svc.sh

actions:
  - start
  - stop
  - restart
  - status
  - createdb

upstream:
  homepage: https://www.postgresql.org/
  docs: https://www.postgresql.org/docs/

dashboard:
  endpoints:
    - "postgres: postgres://127.0.0.1:35432  redis: redis://127.0.0.1:36379"
  hint: "aibox base createdb <module> 建库；连接信息见 $AIBOX_HOME/base.env"
